plugins {
    id 'com.android.application'
}

android {
    namespace 'com.accmgr.phone'
    compileSdk 34

    defaultConfig {
        applicationId "com.accounts.vault"
        minSdk 26
        targetSdk 34
        versionCode Integer.parseInt((project.findProperty("vc") ?: "1").toString())
        versionName "2.0." + (project.findProperty("vc") ?: "1")
        // Which GitHub repo to look at for updates (filled in by the build workflow)
        buildConfigField "String", "GH_REPO", "\"" + (project.findProperty("ghRepo") ?: "") + "\""
    }
    buildFeatures {
        buildConfig true
    }
    signingConfigs {
        stable {
            storeFile file("keystore.p12")
            storePassword "myproject"
            keyAlias "key"
            keyPassword "myproject"
            storeType "pkcs12"
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.stable
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
